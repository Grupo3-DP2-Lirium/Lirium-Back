name: Deploy Lirium Backend to Azure Container Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: lirium-backend
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout del código
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup Java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'eclipse-temurin'

    # 3. Cache Gradle dependencies
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 4. Make gradlew executable
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # 5. Run tests
    - name: Run tests
      run: ./gradlew test

    # 6. Login a Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 7. Login al Azure Container Registry
    - name: Login to Azure Container Registry
      run: az acr login --name acrvacapp

    # 8. Build y Push de la imagen Docker
    - name: Build and push Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # 9. Deploy a Container Apps (solo en main)
    - name: Deploy to Azure Container Apps
      if: github.ref == 'refs/heads/main'
      run: |
        az containerapp update \
          --name ${{ secrets.CONTAINER_APP_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # 10. Verificar deployment
    - name: Verify deployment
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🚀 Deployment completed successfully!"
        echo "📡 API URL: https://lirium-backend--0000006.calmsmoke-a4ab58e7.eastus2.azurecontainerapps.io"
        echo "✨ Features included: Improved error handling, optimized Docker image, and secure table names"
        echo "🔧 Environment: Production with validate mode"