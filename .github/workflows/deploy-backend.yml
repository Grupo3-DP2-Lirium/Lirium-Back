name: Deploy Lirium Backend to Azure Container Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: lirium-backend
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout del código
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup Java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Cache Gradle dependencies
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 4. Make gradlew executable
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # 5. Run tests
    #- name: Run tests
    #  run: ./gradlew test

    # 6. Generate production configuration
    - name: Generate application-prod.properties
      run: |
        cat > src/main/resources/application-prod.properties << 'EOF'
        # Generated production configuration from GitHub Secrets
        spring.application.name=springboot_backend
        
        # Server port configuration
        server.port=8080
        
        # SQL Server datasource configuration (production)
        spring.datasource.url=${{ secrets.DATABASE_URL }}
        spring.datasource.username=${{ secrets.DATABASE_USERNAME }}
        spring.datasource.password=${{ secrets.DATABASE_PASSWORD }}
        spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
        
        # JPA / Hibernate for production
        spring.jpa.hibernate.ddl-auto=validate
        spring.jpa.show-sql=false
        spring.jpa.properties.hibernate.format_sql=false
        spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
        
        # Optional: time zone
        spring.jpa.properties.hibernate.jdbc.time_zone=UTC
        
        # JWT Configuration
        jwt.secret=myVerySecretKeyForJwtTokenGenerationThatIsAtLeast32BytesLong
        jwt.expiration=86400000
        
        # File Upload Configuration
        app.upload.dir=uploads
        
        # Storage Configuration (production)
        app.storage.provider=${{ secrets.STORAGE_PROVIDER }}
        azure.storage.container-name=${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
        azure.storage.connection-string=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        
        # Swagger/OpenAPI Configuration
        springdoc.api-docs.path=/v3/api-docs
        springdoc.swagger-ui.path=/swagger-ui.html
        springdoc.swagger-ui.operationsSorter=method
        springdoc.swagger-ui.tagsSorter=alpha

        # Aumentar límites de upload
        spring.servlet.multipart.max-file-size=150MB
        spring.servlet.multipart.max-request-size=200MB
        spring.servlet.multipart.enabled=true

        # OpenRouter AI Configuration (production)
        openrouter.api.key=${{ secrets.OPENROUTER_API_KEY }}
        openrouter.url=https://openrouter.ai/api/v1/chat/completions
        openrouter.model=mistralai/mistral-7b-instruct
        
        # PayPal Configuration for production
        paypal.client.id=AYhko78F1KkWLhQreC9ht18i-Jn6CxjrRpbyr3c_x2OgzEo82mhxNLIg-7pWB4G2bpkZYvTUD9LrbgVL
        paypal.client.secret=EOjQJJcf0jfJY22qcc4TN80__nPhajHl7IqZla5b-2SBlyjac2Kp3GSmN0Z4WZMPnh9Kp3_mIQqVH3H6
        paypal.base.url=https://api.sandbox.paypal.com

        # Web
        app.share.base-url=https://lirium-front-web.vercel.app
        
        # FFmpeg Configuration for Production (Alpine Linux)
        ffmpeg.path=/usr/bin/ffmpeg
        documentary.temp.path=/tmp/documentaries
        documentary.fonts.path=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        
        # Async Configuration for Documentary Generation
        spring.task.execution.pool.core-size=2
        spring.task.execution.pool.max-size=5
        spring.task.execution.pool.queue-capacity=100

        # SendGrid Email Configuration
        sendgrid.enabled=true
        sendgrid.api.key=${{ secrets.SENDGRID_API_KEY }}
        sendgrid.from.email=no-reply@vacapp.work
        sendgrid.from.name=Remory
        
        EOF

    # 6.1. Generate Firebase credentials from secret
    - name: Generate firebase.json
      run: |
        echo '${{ secrets.FIREBASE_CREDENTIALS }}' > src/main/resources/firebase.json
        echo "✅ Firebase credentials file created"

    # 7. Login a Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 8. Login al Azure Container Registry
    - name: Login to Azure Container Registry
      run: az acr login --name acrvacapp

    # 9. Build y Push de la imagen Docker
    - name: Build and push Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # 10. Deploy a Container Apps (solo en main)
    - name: Deploy to Azure Container Apps
      if: github.ref == 'refs/heads/main'
      run: |
        az containerapp update \
          --name ${{ secrets.CONTAINER_APP_NAME }} \
          --resource-group ${{ secrets.RESOURCE_GROUP }} \
          --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # 11. Verificar deployment
    - name: Verify deployment
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🚀 Deployment completed successfully!"
        echo "📡 API URL: https://lirium-backend.calmsmoke-a4ab58e7.eastus2.azurecontainerapps.io"
        echo "✨ Features included: Improved error handling, optimized Docker image, and secure table names"
        echo "🔧 Environment: Production with validate mode"