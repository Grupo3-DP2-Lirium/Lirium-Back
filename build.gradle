plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'springboot_backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    
    // Azure Blob Storage
    implementation 'com.azure:azure-storage-blob:12.25.1'
    
    // SendGrid Email
    implementation 'com.sendgrid:sendgrid-java:4.10.2'
    
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Task para correr en modo desarrollo
task bootRunDev(type: org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the application with development profile'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.springboot_backend.SpringbootBackendApplication'
    args '--spring.profiles.active=dev'
}

// jvmArgs = ["-Djava.library.path=C:/Users/mlcis/Downloads/sqljdbc_13.2.0.0_enu/sqljdbc_13.2/enu/auth/x64"]

task bootRunProd(type: org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the application with production profile'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.springboot_backend.SpringbootBackendApplication'
    args '--spring.profiles.active=prod'
    jvmArgs = ["-Djava.library.path=C:/Users/mlcis/Downloads/sqljdbc_13.2.0.0_enu/sqljdbc_13.2/enu/auth/x64"]
}
