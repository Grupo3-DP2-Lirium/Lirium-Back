spring.application.name=springboot_backend

# Default profile (development for now)
spring.profiles.active=dev

# Server port configuration
server.port=8081

# PostgreSQL datasource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lirium_db
spring.datasource.username=postgres
spring.datasource.password=932709296
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=myVerySecretKeyForJwtTokenGenerationThatIsAtLeast32BytesLong
jwt.expiration=86400000

# File Upload Configuration
app.upload.dir=uploads

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
