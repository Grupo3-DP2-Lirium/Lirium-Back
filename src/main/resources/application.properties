spring.application.name=springboot_backend

# Default profile (development for now)
#spring.profiles.active=dev

# Server port configuration
server.port=8080

# SQL Server datasource configuration (local development)
spring.datasource.url=jdbc:sqlserver://localhost:1433;database=lirium_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=932709296
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Optional: time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=myVerySecretKeyForJwtTokenGenerationThatIsAtLeast32BytesLong
jwt.expiration=86400000

# File Upload Configuration
app.upload.dir=uploads

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
