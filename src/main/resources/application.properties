spring.application.name=springboot_backend

# Default profile (development for now)
#spring.profiles.active=dev

# Server port configuration
server.port=8080

# SQL Server datasource configuration (production-ready with env vars)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=false;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate for production
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Optional: time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=myVerySecretKeyForJwtTokenGenerationThatIsAtLeast32BytesLong
jwt.expiration=86400000

# File Upload Configuration
app.upload.dir=uploads

# Storage Configuration (production-ready with env vars)
app.storage.provider=${STORAGE_PROVIDER}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
