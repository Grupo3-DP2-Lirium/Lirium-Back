spring.application.name=springboot_backend

# PostgreSQL datasource configuration
spring.datasource.url=jdbc:postgresql://localhost:3309/postgres
spring.datasource.username=postgres
spring.datasource.password=ElDemonioAshura2024
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=myVerySecretKeyForJwtTokenGenerationThatIsAtLeast32BytesLong
jwt.expiration=86400000
