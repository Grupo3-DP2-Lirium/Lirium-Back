# Production profile configuration
spring.application.name=springboot_backend-prod

# Security configuration for production
app.security.enabled=true

# Production database configuration - Azure SQL Database
# These should be environment variables in production
spring.datasource.url=${DATABASE_URL:jdbc:sqlserver://sql-vacapp-server.database.windows.net:1433;database=lirium;encrypt=true;trustServerCertificate=false;loginTimeout=30}
spring.datasource.username=${DATABASE_USERNAME:vacappadmin}
spring.datasource.password=${DATABASE_PASSWORD:VacApp2025!Prod}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate for development - SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Development logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.example.springboot_backend=DEBUG

# Swagger/OpenAPI Configuration for production  
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

