# Development profile configuration
spring.application.name=springboot_backend-dev

# Security configuration for production
app.security.enabled=true

# Server port configuration
server.port=8080

# Database configuration - SQL Server (Docker local)
spring.datasource.url=${DATABASE_URL:jdbc:sqlserver://sql-vacapp-server.database.windows.net:1433;database=lirium;encrypt=true;trustServerCertificate=false;loginTimeout=30}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Azure Blob Storage Configuration (production)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=lirium-files
app.storage.provider=azure

# JPA / Hibernate for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=86400000

# Optional: time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger/OpenAPI Configuration for production  
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Data seeding configuration
app.seeding.enabled=true
app.seeding.auto-run=false

# OpenRouter API key and URL (not public)
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=mistralai/mistral-7b-instruct

# Memorial Share Configuration (Development)
app.share.base-url=http://localhost:3000

# SendGrid Configuration (Development - Dummy mode)
sendgrid.enabled=false
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=noreply@tudominio.com
sendgrid.from.name=Remory Dev

# FFmpeg Configuration
ffmpeg.path=C:/ffmpeg/bin/ffmpeg.exe
documentary.temp.path=C:/temp/documentaries
documentary.fonts.path=C:/Windows/Fonts/arial.ttf

# Async Configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# PayPal Configuration
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.base.url=https://api.sandbox.paypal.com

# PayPal Product and Plans
paypal.plan.create_share.monthly=${PAYPAL_PLAN_CREATE_SHARE_MONTHLY}
paypal.plan.create_share.yearly=${PAYPAL_PLAN_CREATE_SHARE_YEARLY}
paypal.plan.eternal_legacy.monthly=${PAYPAL_PLAN_ETERNAL_LEGACY_MONTHLY}
paypal.plan.eternal_legacy.yearly=${PAYPAL_PLAN_ETERNAL_LEGACY_YEARLY}

# Extra Storage Plans - PayPal
paypal.plan.extra_10gb.monthly=${PAYPAL_PLAN_EXTRA_10GB_MONTHLY}
paypal.plan.extra_50gb.monthly=${PAYPAL_PLAN_EXTRA_50GB_MONTHLY}
paypal.plan.extra_100gb.monthly=${PAYPAL_PLAN_EXTRA_100GB_MONTHLY}

app.storage.max-file-size=104857600
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
