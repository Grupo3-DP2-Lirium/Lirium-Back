# Development profile configuration
spring.application.name=springboot_backend-dev

# Security configuration for development
app.security.enabled=false

# Development database - AWS RDS SQL Server
spring.datasource.url=jdbc:sqlserver://liriumdatabase.cr8e48kui9d6.us-east-1.rds.amazonaws.com:1433;database=lirium;encrypt=true;trustServerCertificate=true;
spring.datasource.username=admin
spring.datasource.password=LiriumDataBaseProject
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate for development - SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Development logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.example.springboot_backend=DEBUG

# CORS more permissive for development
cors.allowed-origins=*
cors.allowed-methods=*
cors.allowed-headers=*

app.storage.provider=local
#azure.storage.connection-string=TU_CONNECTION_STRING
#azure.storage.container-name=lirium-files
