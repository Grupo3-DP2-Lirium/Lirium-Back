# Development profile configuration
spring.application.name=springboot_backend-dev

# Security configuration for production
app.security.enabled=true

# Server port configuration
server.port=8080

# Database configuration - SQL Server (Docker local)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=lirium;encrypt=false;
spring.datasource.username=liriumuser
spring.datasource.password=liriumpass
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Azure Blob Storage Configuration (production)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=stliriumfiles;AccountKey=okxW+IBKMJ3saXVsrKW3y/SZ2xTBCr+LNV6mnlYc+obKj38jaGUaYy575J0sPm5LhbXa2C1SGjWQ+AStEjVpbg==;EndpointSuffix=core.windows.net}
azure.storage.container-name=lirium-files
app.storage.provider=azure

# JPA / Hibernate for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


# JWT Configuration
jwt.secret=myVerySecretKeyForJwtTokenGenerationThatIsAtLeast32BytesLong
jwt.expiration=86400000

# Optional: time zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger/OpenAPI Configuration for production  
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# Data seeding configuration
