# Production profile configuration
spring.application.name=springboot_backend-prod

# Security configuration for production
app.security.enabled=true

# Production database configuration
# These should be environment variables in production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/lirium_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:932709296}

# JPA / Hibernate for production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production logging
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.example.springboot_backend=INFO

# CORS restricted for production
cors.allowed-origins=https://yourdomain.com,https://app.yourdomain.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Requested-With